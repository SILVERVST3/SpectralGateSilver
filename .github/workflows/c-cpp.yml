name: Build SpectralGate SILVER (VST3 Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Visual Studio 2022)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --target SpectralGateSilver_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralGate-SILVER-VST3-Windows
          path: build/SpectralGateSilver_artefacts/Release/VST3/
